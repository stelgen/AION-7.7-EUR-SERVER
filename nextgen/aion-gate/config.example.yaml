# aion-gate — зеркалоо etc/config.txt AuthGateD (ver 41007) + welcome-вары + ship
serverPort: 2106
authAddr: 127.0.0.1
authPort: 2110
numThread: 32
numIOThread: 96
acceptCallNum: 200
socketLimit: 2000
sessionTimeout: 5          # минуты
useForbiddenIPList: true
blockIPsFile: etc/BlockIPs.txt
logDirectory: log
checkGameGuard: false
useGameGuard: false
useNotifyCSResult: true
loginType: 2
companyCode: "2"
logdport: 3999
useLogd: false
tryInterval: 60
tryCount: 20
tryBlockInterval: 120
dumpPacket: true
ggNumActive: 50
useGCSideExtendAccount: true
appLaunchBanDelay: 5
useReportMail: false
authReconnectInterval: 0   # 0 = как оригинал (не реконнектит); >0 — наш реконнект

# === РЕЖИМ (06.10, байон-48) ===
# authgate — живой 7.7 EU флоу (дефолт); classic — beyond-aion 4.8 флоу;
# fork — прозрачный прокси к оригиналу + сравнение ответов в логе.
mode: authgate
# rsaExponent: 17            # П2: 17 (Pub.key[1]) | 65537 (F4 гита) — калибруется живым логином
# loginDecbufLen: 34         # decbuf в authd-blob: 34 (user14+pwd16+otp4) | 32 | 128
# forkOrigAddr: 127.0.0.1    # fork: куда форвардить клиента (ориг AuthGateD)
# forkOrigPort: 2109
# worldIP: 192.168.0.125
# worldPort: 7777
# serverID: 1                # id сервера в эмуляции play-ok ([07][pk1][pk2][serverID][6×0])
# smAuthGgWire: 42           # SM_AUTH_GG: 42 = live-форма (дефолт) | 50 = эталон 7.7 (D sid+B35)

# welcome (authgate): финальная раскладка 194B зашита в код (серверный скрамбл, live-принята);
# эпоха probe-вариантов/фикстур завершена 07.10 — ключи welcomeProbe/welcomeForceVariant/
# welcomeFixture/variantHoldSec удалены (история — docs/fork-classic-deploy-20261006.md)
# welcomeTestCC: 0          # >0: в ответ на AUTH_GG слать cc-код (тест сообщений: 22 = «заблокирован»)
# welcomeWaitAuthdMs: 2000  # ждать [03] от authd до welcome (V≠0), 0 = сразу

# === T1 ФЕЙЛЫ (08.10, сорс Mobius_AionEmu 7.7; тексты клиента — authfail.go) ===
authdTimeoutSec: 15         # ЕДИНЫЙ бизнес-таймаут тишины authd (login+play) → фейл+close
failCloseSec: 2             # после фейла рвать сессию через N сек
loginFailCode: 1            # SM_LOGIN_FAIL при таймауте (1 = «Ошибка авторизации…»)
playFailCode: 8             # SM_PLAY_FAIL при таймауте (8 = «Сервер временно недоступен»)
onlineTtlSec: 0             # гейт-лок relogin ВЫКЛ (юзер 08.10); N>0 = немедленный LoginFail(7)
loginFailOnline: 7          # код гейт-лока (7 = «Вы уже залогинись.»)

# ТЕСТ-КРУТИЛКА ошибок (08.10, прогон завершён — НЕ юзаем; вкл = loginTestFail: -1/-N/N)
# loginTestFail: -1         # -1 = CYCLE 1..22+45 (каждый логин следующий код), >0 = фикс-код
# playTestFail: -1          # то же для SM_PLAY_FAIL на [05]/[02]

# телеметрия TELEMETRY-SPEC (пакет ship копируется из aion-logd)
ship:
  enabled: false
