# ship-конфиг aion-captcha — по TELEMETRY-SPEC §5
# Сеть VM→Linux (192.168.0.2:514) ЗАБЛОКИРОВАНА (тест 21.10: UDP SENT OK с VM,
# listener 0.0.0.0:514 на Linux жив, пакет не дошёл — NAT/фаервол дропает входящий).
# Включён явный file-фолбэк (правило №1: только явно), syslog.host прописан —
# включить при открытии порта 514/UDP VM→192.168.0.2.
ship:
  enabled: false            # сетевые синки ВЫКЛ до открытия порта 514
  syslog: { net: "udp", host: "192.168.0.2:514", facility: 1 }
  http:   { url: "", timeout: 3 }
  file:   { enabled: true, dir: "./logs/ship" }   # фолбэк: D:\SAION\aion-captcha\logs\ship\YYYY-MM-DD.ndjson
  queue: 4096
  self_sec: 300
  max_raw: 512
