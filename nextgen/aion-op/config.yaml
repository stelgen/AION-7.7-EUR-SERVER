# aion-op: operator stack AION 7.7 EUR (ASCII-only config, per user rule 07.10)
# WHO STARTS WHAT (order):
#   SQL 1433 -> acc 2220 -> logd 2051 -> ic 2005 -> captcha 22206 -> [PA skip]
#   -> authd 2104/2110 (orig, session 1 /IT) -> gate 2106 (nash aion-gate, /IT)
#   -> cache 2006 -> npc 2002 (load 10-15 min) -> main 7777 (wait 16 NPC conns)
# RULE: ALL orig NC binaries start in session 1 via /IT tasks; ours (Go) — session 0 ok.
# NEVER start whole stack via AionAuth (auth.bat = start-all) unless full reboot.

vm:
  mode: local
  ssh_host: 192.168.0.125
  ssh_port: 22
  ssh_user: Administrator
  ssh_key: ""

operator:
  ui_port: 10200
  bind: "0.0.0.0"
  refresh_sec: 10
  mode: operate
  dry_run: false

services:
  - id: acc
    group: light
    display: AccountCacheServer
    exe: AccountCacheServer.exe
    task: AionAcc
    ports: [2220]
    order: 1
  - id: logd
    group: light
    display: aion-logd (nash)
    exe: aion-logd.exe
    task: AionLogCap
    ports: [2051]
    order: 2
  - id: logsrv
    group: light
    display: LogServer64 (zamenen nashim logd)
    exe: LogServer64.exe
    task: AionLog
    ports: [2051]
    order: 12
    locked: true
  - id: ic
    group: light
    display: ICServer
    exe: ICServer.exe
    task: AionICSrv
    ports: [2005]
    order: 3
  - id: captcha
    group: light
    display: aion-captcha (nash)
    exe: aion-captcha.exe
    task: AionCAPTCHA
    ports: [22206]
    order: 4
  - id: pa
    group: light
    display: PA Server 7.7 (OBYAZATELEN! UsePAServer=true; bez nego = SYSTEM_ERROR 20 na login)
    exe: 01-PAServer7.7.exe
    task: AionPA
    ports: [10057]
    order: 5

  - id: authd
    group: auth
    display: L2Authd (orig 2104/2110)
    exe: L2Authd.exe
    task: AionAuthOnly
    kill_task: AionKickAuth
    ports: [2104, 2110]
    order: 6
    interactive: true
  - id: gate
    group: auth
    display: aion-gate (nash 2106)
    exe: aion-gate.exe
    task: AionGate
    kill_task: AionKickGate
    ports: [2106]
    order: 7
    interactive: true
  - id: gateorig
    group: auth
    display: AuthGateD (orig-2109, A/B)
    exe: AuthGateD.exe
    task: AionGateOrig
    ports: [2109]
    order: 11
    interactive: true

  - id: cache
    group: heavy
    display: CacheD64
    exe: CacheD64.exe
    task: AionCache
    ports: [2006, 2007]
    order: 8
    heavy: true
  - id: npc
    group: heavy
    display: NPCSvr64
    exe: NPCSvr64.exe
    task: AionNPCit
    kill_task: AionKickNPC2
    ports: []
    order: 9
    heavy: true
    pair: world_pair
  - id: main
    group: heavy
    display: Server64 (main)
    exe: Server64.exe
    task: AionMainit
    kill_task: AionKickMain
    ports: [2002, 7777]
    order: 10
    heavy: true
    pair: world_pair
    pair_master: true

  - id: authdn
    group: fork
    display: aion-authd (shadow 2117)
    exe: aion-authd.exe
    task: AionAuthdShadow
    ports: [2117]
    order: 1
  - id: forkd
    group: fork
    display: forkauthd (front 2116)
    exe: forkauthd.exe
    task: AionForkAuthd
    ports: [2116]
    order: 2

  - id: sql
    group: sql
    display: MSSQL (monitoring)
    exe: sqlservr.exe
    task: ""
    ports: [1433]
    order: 0
    observe_only: true

  - id: chat
    group: svc
    display: ChannelChat
    exe: ChannelChattingServer.exe
    task: AionChanChat
    ports: [10254]
    order: 0
    locked: true
  - id: nprelay
    group: svc
    display: NPRelay
    exe: NPRelay64.exe
    task: ""
    ports: []
    order: 0
    locked: true
  - id: petition
    group: svc
    display: PetitionD
    exe: PetitionD_Integration.exe
    task: ""
    ports: [21055]
    order: 0
    locked: true
  - id: shopagent
    group: svc
    display: ShopAgent
    exe: ShopAgentServer.exe
    task: ""
    ports: [10100]
    order: 0
    locked: true
  - id: ranking
    group: svc
    display: RankingServer (.NET)
    exe: RankingServer.exe
    task: ""
    ports: []
    order: 0
    locked: true

groups:
  light: { title: "Lekkie (SYSTEM/session-0; orig NC = /IT)", icon: "L" }
  auth:  { title: "Auth (/IT, session-1)", icon: "A" }
  heavy: { title: "Tyazhelye: CacheD + para NPC+MAIN", icon: "H" }
  fork:  { title: "R5 fork-stend: 2116 front -> orig 2110 + shadow aion-authd 2117", icon: "F" }
  sql:   { title: "SQL (monitoring)", icon: "S" }
  svc:   { title: "Mertvye servisy 7.7-kita (locked)", icon: "X" }

world_pair:
  npc_port: 2002          # Server64 side of NPCSvr link
  expected_conns: 8       # 8 conns = 16 netstat-lines (start-all criterion); world assembled

store:
  path: aionop.db
  retention_days: 30

pprof:
  enabled: true
  addr: "127.0.0.1:10201"

metrics:
  poll_sec: 15

logs:
  poll_sec: 20
  tail_lines: 200
  files:
    - { svc: cache,  path: "D:/AION_LIVE_SERVER/CacheServer/log/{{date}}.err" }
    - { svc: main,   path: "D:/AION_LIVE_SERVER/MainServer/log/{{date}}.err" }
    - { svc: npc,    path: "D:/AION_LIVE_SERVER/NPCServer/log/{{date}}.err" }
    - { svc: logsrv, path: "D:/AION_LIVE_SERVER/LogServer/log/{{date}}.err" }
    - { svc: authd,  path: "D:/AION_LIVE_SERVER/AuthD/etc/log/{{date}}.err" }
    - { svc: gate,   path: "D:/SAION/aion-gate/gate-prod.log" }
    - { svc: logd,   path: "D:/SAION/aion-logd/logd.log" }
    - { svc: authdn, path: "D:/SAION/aion-authd/shadow.log" }
    - { svc: forkd,  path: "D:/SAION/aion-authd/fork-authd.log" }

sql:
  enabled: true
  poll_sec: 30
  conn: "sqlserver://aionop_ro:СЕКРЕТ-НА-VM@127.0.0.1:1433?database=master&encrypt=disable"