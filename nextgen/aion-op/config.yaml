# aion-op: топология стека AION 7.7 EUR (канон из эксплуатации 02–05.10.2026)
# Phase 0 = observe: НИЧЕГО не исполняется на проде, только read-only пробы.
# Единственный источник истины о топологии. Секреты (SSH-ключи/пароли) здесь НЕ хранятся.

vm:
  mode: mock              # mock | ssh
  ssh_host: 192.168.0.125
  ssh_port: 22
  ssh_user: Администратор
  ssh_key: ""             # пусто = дефолтный ключ/агент

operator:
  ui_port: 10200
  bind: "0.0.0.0"         # вся локалка юзера; наружу не торчит (NAT закрыт) — по решению юзера
  refresh_sec: 10
  mode: observe           # observe | operate (operate требует явного dry_run: false)
  dry_run: true           # действия только планируются (audit без исполнения). Фаза 1.5

# Порядок старта = поле order; стоп в обратном. Канон: LOG→CACHE→NPC(10–15 мин)→MAIN.
services:
  - id: acc
    group: light
    display: AccountCacheServer
    exe: AccountCacheServer.exe
    task: AionAcc
    ports: [2220]
    order: 1
  - id: logsrv
    group: light
    display: LogServer64
    exe: LogServer64.exe
    task: AionLog
    ports: [2051]
    order: 2
  - id: ic
    group: light
    display: ICServer
    exe: ICServer.exe
    task: AionICSrv
    ports: [2005]
    order: 3
  - id: captcha
    group: light
    display: CAPTCHAImageServer
    exe: CAPTCHAImageServer.exe
    task: AionCAPTCHA
    ports: [22206]
    order: 4
  - id: pa
    group: light
    display: PA Server 7.7
    exe: 01-PAServer7.7.exe
    task: AionPA
    ports: [10057]
    order: 5

  - id: authd
    group: auth
    display: L2Authd
    exe: L2Authd.exe
    task: AionAuth
    kill_task: AionKickAuth   # создать при переходе в operate (DEPLOY.md)
    ports: [2104]
    order: 6
    interactive: true
  - id: gate
    group: auth
    display: AuthGateD
    exe: AuthGateD.exe
    task: AionGate
    kill_task: AionKickGate   # создать при переходе в operate (DEPLOY.md)
    ports: [2106]
    order: 7
    interactive: true

  - id: cache
    group: heavy
    display: CacheD64
    exe: CacheD64.exe
    task: AionCache
    ports: [2006, 2007]
    order: 8
    heavy: true
  - id: npc
    group: heavy
    display: NPCSvr64
    exe: NPCSvr64.exe
    task: AionNPCit
    kill_task: AionKickNPC2   # задача-киллер юзер-сессии (есть на VM)
    ports: []
    order: 9
    heavy: true
    pair: world_pair
  - id: main
    group: heavy
    display: Server64 (мир)
    exe: Server64.exe
    task: AionMainit
    kill_task: AionKickMain   # задача-киллер юзер-сессии (есть на VM)
    ports: [2002, 7777]
    order: 10
    heavy: true
    pair: world_pair
    pair_master: true

  - id: sql
    group: sql
    display: MSSQL (наблюдение)
    exe: sqlservr.exe
    task: ""
    ports: [1433]
    order: 0
    observe_only: true

  # Мёртвые в 7.7-ките (см. nextgen/PLAN.md §4): замки, кнопок нет.
  - id: chat
    group: svc
    display: ChannelChat
    exe: ChannelChattingServer.exe
    task: AionChanChat
    ports: [10254]
    order: 0
    locked: true
  - id: nprelay
    group: svc
    display: NPRelay
    exe: NPRelay64.exe
    task: ""
    ports: []
    order: 0
    locked: true
  - id: petition
    group: svc
    display: PetitionD
    exe: PetitionD_Integration.exe
    task: ""
    ports: [21055]
    order: 0
    locked: true
  - id: shopagent
    group: svc
    display: ShopAgent
    exe: ShopAgentServer.exe
    task: ""
    ports: [10100]
    order: 0
    locked: true
  - id: ranking
    group: svc
    display: RankingServer (.NET)
    exe: RankingServer.exe
    task: ""
    ports: []
    order: 0
    locked: true

groups:
  light: { title: "Лёгкие (SYSTEM, session-0)", icon: "🟦" }
  auth:  { title: "Auth (/IT, интерактивная сессия)", icon: "🟨" }
  heavy: { title: "Тяжёлые: CacheD + пара NPC+MAIN", icon: "🟥" }
  sql:   { title: "SQL (только наблюдение)", icon: "⬛" }
  svc:   { title: "Не работает в 7.7-ките (замок)", icon: "🔒" }

world_pair:
  npc_port: 2002          # листенер Server64, к которому цепляется NPCSvr
  expected_conns: 16      # 16 ESTABLISHED = мир собран

# --- Phase 0.5: глаза (логи/метрики/алерты) — всё по-прежнему read-only ---

store:
  path: aionop.db         # SQLite WAL (в .gitignore)
  retention_days: 30

pprof:
  enabled: true           # только на loopback
  addr: "127.0.0.1:10201"

metrics:
  poll_sec: 15            # срез RAM/handles/FreeCommit (read-only powershell)

# SQL-наблюдение: логин aionop_ro = db_datareader + VIEW SERVER STATE (read-only).
# В репо конн НЕ хранится — он только в build/config-vm.yaml на VM (gitignored).
sql:
  enabled: false
  poll_sec: 30
  conn: ""

# Хвосты логов: NC пишет .err по дням ({{date}} = YYYY-MM-DD).
# Файл может отсутствовать — тейлер молча пропускает (новый день/не запускался).
logs:
  poll_sec: 20
  tail_lines: 200
  files:
    - { svc: cache,  path: "D:/AION_LIVE_SERVER/CacheServer/log/{{date}}.err" }
    - { svc: main,   path: "D:/AION_LIVE_SERVER/MainServer/log/{{date}}.err" }
    - { svc: npc,    path: "D:/AION_LIVE_SERVER/NPCServer/log/{{date}}.err" }
    - { svc: logsrv, path: "D:/AION_LIVE_SERVER/LogServer/log/{{date}}.err" }
    - { svc: authd,  path: "D:/AION_LIVE_SERVER/AuthD/etc/log/{{date}}.err" }
    - { svc: gate,   path: "D:/AION_LIVE_SERVER/AuthGateD/log/{{date}}.err" }
