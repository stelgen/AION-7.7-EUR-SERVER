# aion-authd — конфиг (дефолты = live-факты 06-07.10; ASCII, без секретов в гит)

serverPort: 2110          # serverExPort — наш aion-gate
authVersion: 50465        # 0x0000c621 — приветствие [03] (live)

serverID: 1
worldIP: "192.168.0.125"  # тип=4 server-info: IP мира (клиент уйдёт сюда :7777)
worldPort: 7777
maxUsers: 2000            # поле serverlist (live 2000)
type3Unk1: 2696412939     # 0xa0c69f0b — живой dword из serverlist (семантика — R5-дифф)

strictAsmBlob: true       # login-blob строго 191Б (live: 86Б → тишина оригинала)
autoCreate: true          # автосоздание акка по ASCII-логину (live: пароль НЕ проверяется)
reloginPolicy: "silent"   # live-паритет: relogin онлайн-акка = тишина (гейт сам отдаст fail по таймауту); | fail7
onlineTtlSec: 300         # online-флаг живёт 2-6 мин (live) — дефолт 5 мин
sweepSec: 30
clearOnlineOnDisconnect: false  # live: [01] гейта флаг НЕ снимает

failCodeBadUser: 2        # не-ASCII/пустой логин (live → 18Б LoginFail)
failCodeBlocked: 22       # «Ваш аккаунт заблокирован.»
failCodeDB: 1             # SYSTEM_ERROR

# Мир-канал Server64 (serverPort 2104, C1 WorldSrvSocket; docs/authd-2104-recon-20261009.md):
# протокол [u16 X LE][type][payload], X = total-1; greeting [03][authVersion][1];
# heartbeat 60с (type 2/5); релей логина type 0 = uid+аккаунт+2000+tail (живой корпус 09.10).
gsPort: 0                 # 0 = листенер ВЫКЛ (вкл. только для стенда/fork или R6-свитча по «го»)
gsAuthVersion: 2017012601 # из живого лога Server64: «Protocol Version authVersion:2017012601»
gsHeartbeatSec: 60
gsAcks: false             # квитанции 13-44 на события мира — после fork-диффа 2104
# gsRelayTailHex: "..."    # tail type-0 релея [49:107] (default = живой корпус 09.10)

db:
  driver: mem             # mem | mssql  (mssql — на VM: connStr ТОЛЬКО здесь/env AUTHD_CONNSTR)
  connStr: ""             # СЕКРЕТ. Пример: sqlserver://user:pass@127.0.0.1:1433?database=AionAccounts
  autoCreate: true
  # Дефолты (09.10) = РЕАЛЬНЫЕ procs AionAccounts (R0-инвентарь authd-ref/procs-aionaccounts-77.rpt):
  #   qAccount = ap_GPwdWithFlag (автосоздание внутри SQL) + ap_GStat; qInsert = ap_AutoReg;
  #   qBlocks = ap_GetRestriction; qLogLogin = UPDATE last_login (эффект ap_GStat).
  # Переопределение (напр. прямые SQL по C1-схеме):
  # qAccount: "SELECT uid, ... FROM user_account WITH (NOLOCK) WHERE account = @account"
  # qInsert:  "INSERT INTO user_account ...; SELECT CAST(SCOPE_IDENTITY() AS int);"
  # qBlocks:  "SELECT reason, msg FROM block_msg WITH (NOLOCK) WHERE uid = @uid"
  # qLogLogin: "UPDATE user_account SET last_login=@now, last_ip=@ip WHERE uid=@uid"

ship:                     # TELEMETRY-SPEC (ключи единые со всеми переписями)
  enabled: false
  syslog: { net: "udp", host: "", facility: 1 }
  http:   { url: "", timeout: 3 }
  file:   { enabled: false, dir: "./logs/ship" }
  queue: 4096
  self_sec: 300
  max_raw: 512
